<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
    <style>
        .mark-stroke { stroke: #18181b; }
        .mark-fill { fill: #18181b; }
        @media (prefers-color-scheme: dark) {
            .mark-stroke { stroke: #fafafa; }
            .mark-fill { fill: #fafafa; }
        }
    </style>
    <g transform="translate(64,64)">
        <!-- Outer Orbital Meridian Ring -->
        <circle cx="0" cy="0" r="52" class="mark-stroke" stroke-width="2.5" stroke-dasharray="12 6" opacity="0.4" />
        <!-- Structural Boundary Diamond -->
        <polygon points="0,-46 46,0 0,46 -46,0" class="mark-stroke" stroke-width="3" fill="none" opacity="0.85" />
        <!-- Inner Geometric Core -->
        <polygon points="0,-24 24,0 0,24 -24,0" class="mark-fill" opacity="0.95" />
        <!-- Topological Meridian Nodes -->
        <circle cx="0" cy="-46" r="4.5" class="mark-fill" />
        <circle cx="46" cy="0" r="4.5" class="mark-fill" />
        <circle cx="0" cy="46" r="4.5" class="mark-fill" />
        <circle cx="-46" cy="0" r="4.5" class="mark-fill" />
        <!-- Core Nexus Center Point -->
        <circle cx="0" cy="0" r="5" fill="#ffffff" />
    </g>
</svg>
